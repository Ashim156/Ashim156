<rect width="1200" height="230" rx="18" fill="#120706"/>
<rect x=".5" y=".5" width="1199" height="229" rx="18" fill="none" stroke="#e8604f" stroke-opacity=".3"/>
<text x="46" y="52" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" fill="#a89488" letter-spacing="3">~/ashim  $  now</text>
<g style="animation:fade .8s 0.2s both"><circle cx="46" cy="94" r="5" fill="#e8604f"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></circle><text x="68" y="100" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#f6a38f" letter-spacing="1">BUILDING</text><text x="200" y="100" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#f4eadb">MekMitra, a garage management SaaS for auto workshops in Nepal</text></g>
<g style="animation:fade .8s 0.5s both"><circle cx="46" cy="134" r="5" fill="#e8604f"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle><text x="68" y="140" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#f6a38f" letter-spacing="1">LEADING</text><text x="200" y="140" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#f4eadb">a dev team shipping ERP and CRM platforms at Codesc Nepal</text></g>
<g style="animation:fade .8s 0.8s both"><circle cx="46" cy="174" r="5" fill="#e8604f"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.4;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle><text x="68" y="180" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" fill="#f6a38f" letter-spacing="1">EXPLORING</text><text x="200" y="180" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#f4eadb">where AI genuinely makes software more useful</text></g>
<rect x="940" y="20" width="12" height="12" rx="6" fill="#e8604f"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></rect>
